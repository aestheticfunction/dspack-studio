name: deploy-composer-beta

# Explicit deployment for the BETA composer Worker
# (composer-beta.aesthetic-function.com): the experimental artifact,
# apps/composer/out-experimental, with interface blocks behind the beta's
# runtime switch (docs/blocks/PHASE-2-RELEASE-PLAN.md §6; docs/deployment.md,
# "The beta composer").
#
# Dispatched only, from main, through the protected composer-beta environment
# (a required reviewer, main only). Nothing else deploys this Worker: it is
# never connected to Workers Builds, which reads ./wrangler.jsonc and deploys
# the production composer on every merge to main.
#
# Auth: CLOUDFLARE_API_TOKEN_BETA, a secret of the composer-beta environment
# and never the production token: Editor on this one Worker, plus Workers
# Routes Write on the zone for its custom domain, a permission that reaches
# every hostname in the zone (docs/deployment.md). With it, CLOUDFLARE_ACCOUNT_ID,
# a variable of the same environment (a token scoped to one Worker cannot look
# the account up). Inert until both exist.
# CF_ACCESS_CLIENT_ID_BETA and
# CF_ACCESS_CLIENT_SECRET_BETA are reserved for a later authenticated smoke;
# this workflow sends no credentials, so its only check of the deployed beta is
# that Cloudflare Access sends an anonymous request to its login.
#
# Every deploy records its rollback anchor first, and refuses to deploy when
# it cannot. Only the first deploy goes ahead without one: when the dispatch
# says so (first_deploy) and wrangler reports that the beta Worker does not
# exist (code 10007). first_deploy is refused once the Worker exists. A first
# deploy also skips the pre-deploy Access check: the hostname does not exist
# yet, and asking would only leave its absence cached on the runner for the
# post-deploy check.
#
# The token reaches only the steps that call Cloudflare, never an install
# (wrangler's own included) or the build, which run third-party code.
#
# Rollback (from any machine with wrangler auth for the beta):
#   npx --yes wrangler@4.146.0 rollback --config wrangler.composer-beta.jsonc
# targeting the anchor version recorded in this run's summary. A rollback may
# restore that version's BLOCKS_BETA and HOSTED_AI, so set both again after it
# and check /api/models. Production and the beta roll back independently.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-composer-beta" to confirm a deployment of the beta composer Worker'
        required: true
      first_deploy:
        description: 'The first deploy only: the beta Worker does not exist yet, so there is no rollback anchor to record'
        type: boolean
        default: false

concurrency:
  group: deploy-composer-beta
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-composer-beta' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: composer-beta
    permissions:
      contents: read
    steps:
      - name: The beta deploys only with its own credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN_BETA is not set in the composer-beta environment; refusing to deploy"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not set in the composer-beta environment; refusing to deploy"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile
      - name: Build the experimental artifact (apps/composer/out-experimental)
        run: pnpm --filter composer build:experimental
      - name: Guards (the production and beta configs; an experimental artifact that carries the switch)
        run: node apps/composer/scripts/check-beta-deploy.mjs
      - name: Cloudflare Access already sends anonymous requests to its login
        if: ${{ !inputs.first_deploy }}
        run: node apps/composer/scripts/check-beta-deploy.mjs --access=before
      - name: Install the pinned wrangler, with no credentials
        run: npx --yes wrangler@4.146.0 --version
      - name: Record the rollback anchor (currently active version)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FIRST_DEPLOY: ${{ inputs.first_deploy }}
        run: |
          echo '## Beta composer deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if listing=$(npx --yes wrangler@4.146.0 deployments list --config wrangler.composer-beta.jsonc 2>&1); then
            if [ "$FIRST_DEPLOY" = "true" ]; then
              printf '%s\n' "$listing" | tail -8
              echo "The beta Worker already exists, so this is not a first deploy. Dispatch again without first_deploy."
              exit 1
            fi
            printf '%s\n' "$listing" | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$FIRST_DEPLOY" = "true" ] && printf '%s\n' "$listing" | grep -qF '[code: 10007]'; then
            printf '%s\n' "$listing" | tail -8
            echo "first deploy, as dispatched: wrangler reports no beta Worker yet (code 10007), so there is no earlier version to anchor" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "$listing" | tail -20
            echo "The rollback anchor could not be recorded, so nothing is deployed. first_deploy goes ahead only when wrangler reports that the beta Worker does not exist (code 10007)."
            exit 1
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy (beta Worker only, checked-in config)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy --config wrangler.composer-beta.jsonc
      - name: Record the deployed version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BETA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4.146.0 deployments list --config wrangler.composer-beta.jsonc | tail -8 | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'rollback: npx --yes wrangler@4.146.0 rollback --config wrangler.composer-beta.jsonc  (target = the anchor above; then set BLOCKS_BETA and HOSTED_AI again)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # On a first deploy, a check that still fails on DNS or TLS is run again
      # later from any machine (docs/deployment.md), never by re-running this run.
      - name: Cloudflare Access sends anonymous requests for the deployed beta to its login
        run: node apps/composer/scripts/check-beta-deploy.mjs --access=after
