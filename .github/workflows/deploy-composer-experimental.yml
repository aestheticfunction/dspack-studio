name: deploy-composer-experimental

# Explicit deployment of the EXPERIMENTAL artifact, apps/composer/out-experimental
# (interface blocks behind the beta's runtime switch), to the existing composer
# Worker, dspack-studio-composer, on composer.aesthetic-function.com: the
# invite-only beta under the owner's single-host amendment
# (docs/blocks/BETA-DEPLOY-PLAN.md; docs/deployment.md, "The invite-only beta").
#
# Dispatched only, from main, through the protected composer-experimental
# environment (a required reviewer, main only). Workers Builds keeps deploying
# the block-free default artifact through ./wrangler.jsonc on every merge to
# main, which replaces this deploy, an automatic rollback, until this workflow
# is dispatched again.
#
# Cloudflare Access must already protect the whole hostname: before anything is
# deployed, anonymous GET requests for the page, the API and the static assets,
# and an anonymous POST to /api/propose, must all be sent to the Access login.
# Otherwise nothing is deployed. The check runs again after the deploy.
#
# Auth: CLOUDFLARE_API_TOKEN_EXPERIMENTAL, a secret of the
# composer-experimental environment and never the repository's production
# CLOUDFLARE_API_TOKEN: Editor on this one Worker, plus Workers Routes Write on
# the zone for its custom domain, a permission that reaches every hostname in
# the zone (docs/deployment.md). Its own name matters: a dispatch to an
# environment that does not exist yet creates it unprotected, and a secret of
# this name is then simply missing, so the run refuses instead of reaching the
# repository's token. With it, CLOUDFLARE_ACCOUNT_ID, a variable of the same
# environment (a token scoped to one Worker cannot look the account up). Inert
# until both exist. The workflow sends no Access credential: its only checks of
# the hostname are anonymous.
#
# Every deploy records its rollback anchor first: the one version the latest
# deployment serves at 100% (wrangler deployments status --json). It refuses to
# deploy without one: the Worker exists, so there is always one, and a gradual
# split names none. The block-free anchor the owner recorded before the first
# experimental deploy is the one a rollback to the release candidate targets.
#
# wrangler makes the new version live before it publishes the custom domain's
# settings, so a failed deploy step may already have deployed. The version is
# recorded and Access checked again whenever the deploy step ran.
#
# The token reaches only the steps that call Cloudflare, never an install
# (wrangler's own included) or the build, which run third-party code.
#
# Rollback (from any machine with wrangler auth for this Worker):
#   npx --yes wrangler@4.146.0 rollback <anchor version id> --config wrangler.jsonc
# Either config names the same Worker. A rollback deploys that version as it
# was, and may bring back the BLOCKS_BETA, HOSTED_AI and BETA_OPERATOR_LOG it
# had, so set all three again after it, and check /api/models in a signed-in
# browser.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-composer-experimental" to confirm a deployment of the experimental artifact to the composer Worker'
        required: true

concurrency:
  group: deploy-composer-experimental
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-composer-experimental' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: composer-experimental
    permissions:
      contents: read
    steps:
      - name: The experimental deploy uses only its own credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EXPERIMENTAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN_EXPERIMENTAL is not set in the composer-experimental environment; refusing to deploy"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not set in the composer-experimental environment; refusing to deploy"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile
      - name: Build the experimental artifact (apps/composer/out-experimental)
        run: pnpm --filter composer build:experimental
      - name: Guards (both configs are the composer Worker; an experimental artifact that carries the switch)
        run: node apps/composer/scripts/check-experimental-deploy.mjs
      - name: Cloudflare Access already sends anonymous requests, GET and POST, to its login
        run: node apps/composer/scripts/check-experimental-deploy.mjs --access=before
      - name: Install the pinned wrangler, with no credentials
        run: npx --yes wrangler@4.146.0 --version
      - name: Record the rollback anchor (currently active version)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EXPERIMENTAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo '## Composer experimental deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if ! status=$(npx --yes wrangler@4.146.0 deployments status --json --config wrangler.composer-experimental.jsonc); then
            echo "The active deployment could not be read, so there is no rollback anchor, and nothing is deployed."
            exit 1
          fi
          if ! anchor=$(printf '%s' "$status" | node apps/composer/scripts/check-experimental-deploy.mjs --active-version); then
            echo "The active deployment does not serve one version at 100%, so there is no rollback anchor, and nothing is deployed."
            exit 1
          fi
          echo "anchor: $anchor" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy (the experimental artifact to the composer Worker, checked-in config)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EXPERIMENTAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy --config wrangler.composer-experimental.jsonc
      - name: Record the deployed version
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_EXPERIMENTAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          status=$(npx --yes wrangler@4.146.0 deployments status --json --config wrangler.composer-experimental.jsonc)
          live=$(printf '%s' "$status" | node apps/composer/scripts/check-experimental-deploy.mjs --active-version)
          echo "live: $live" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'rollback: npx --yes wrangler@4.146.0 rollback <anchor version id> --config wrangler.jsonc  (the block-free anchor recorded before the first experimental deploy, or the one above; then set BLOCKS_BETA, HOSTED_AI and BETA_OPERATOR_LOG again)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # A check that fails here means the hostname answered an anonymous request
      # without Access: roll back to the anchor at once (docs/deployment.md).
      - name: Cloudflare Access still sends anonymous requests, GET and POST, to its login
        if: ${{ !cancelled() && steps.deploy.outcome != 'skipped' }}
        run: node apps/composer/scripts/check-experimental-deploy.mjs --access=after
