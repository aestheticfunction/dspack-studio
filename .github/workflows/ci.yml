name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile
      - name: Contract gates (A2UI 0.9.1 + 1.0) and scenario surfaces
        run: pnpm --filter @dspack-studio/contracts build:catalogs
      - name: Contract copies match the authoritative dspack main (sync check)
        # THE INVARIANT (PHASE-NEXT P0): at every green commit on main, the
        # canonical Astryx contract in dspack and the copy consumed here are
        # byte-identical. Locally: pnpm --filter @dspack-studio/contracts check:sync
        run: pnpm --filter @dspack-studio/contracts check:sync
      - name: Astryx vocabulary drift check (report-only, local CLI)
        run: pnpm --filter @dspack-studio/contracts drift-check
      - name: Unit tests
        run: |
          pnpm --filter @dspack-studio/a2ui-ingest test
          pnpm --filter @dspack-studio/agui-bridge test
          pnpm --filter @dspack-studio/replay test
          pnpm --filter @dspack-studio/scenarios test
          pnpm --filter @dspack-studio/shadcn-renderers test
          pnpm --filter agent test
          pnpm --filter web test
      - name: Type checks
        run: pnpm -r typecheck
      - name: Static export (the deploy artifact)
        run: pnpm --filter web build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # The e2e suite drives the REAL static export plus the local agent in
      # its deterministic paths only (scripted adapter, authored scenarios,
      # break-it scripts). No Ollama, no model calls, no network beyond
      # localhost: live-model specs are gated behind RECORD_LIVE/BENCH and
      # skip in CI by design.
      - name: Playwright (replay, live-deterministic, interactive, inspectors, break-it, import/export)
        run: pnpm exec playwright test
      # The composer's ledger-v2 decision controls only render in AGENT mode
      # against a real project on disk, so neither the exhibit suite above
      # nor the deployed-composer smoke can reach them (dspack-studio#32).
      # This drives the real static export + the real agent + real files.
      - name: Composer static export (the agent-mode suite's artifact)
        run: pnpm --filter composer build
      - name: Playwright (composer agent-mode decisions + accessibility)
        run: pnpm exec playwright test --config playwright.composer-agent.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
