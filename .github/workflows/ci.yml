name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen-lockfile install
        run: pnpm install --frozen-lockfile
      - name: Contract gates (A2UI 0.9.1 + 1.0) and scenario surfaces
        run: pnpm --filter @dspack-studio/contracts build:catalogs
      - name: Contract copies match the authoritative dspack main (sync check)
        # THE INVARIANT (PHASE-NEXT P0): at every green commit on main, the
        # canonical Astryx contract in dspack and the copy consumed here are
        # byte-identical. Locally: pnpm --filter @dspack-studio/contracts check:sync
        run: pnpm --filter @dspack-studio/contracts check:sync
      - name: Astryx vocabulary drift check (report-only, local CLI)
        run: pnpm --filter @dspack-studio/contracts drift-check
      - name: Unit tests
        # THE INVARIANT: CI runs EVERY workspace test script, never a
        # hand-maintained filter list. The list this replaced had silently
        # omitted @dspack-studio/composer-core (89 tests — both planners, the
        # ledger, findings, the flow schema), @dspack-studio/wireframe-renderers
        # (4) and @dspack-studio/contracts (2): a package could be added, hold
        # product logic, go red, and CI stayed green because its name was never
        # typed here. `pnpm test` is the root script, so what a contributor runs
        # locally and what CI enforces are the same command by construction.
        run: pnpm test
      - name: Type checks
        run: pnpm -r typecheck
      - name: Static export (the deploy artifact)
        run: pnpm --filter web build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # The e2e suite drives the REAL static export plus the local agent in
      # its deterministic paths only (scripted adapter, authored scenarios,
      # break-it scripts). No Ollama, no model calls, no network beyond
      # localhost: live-model specs are gated behind RECORD_LIVE/BENCH and
      # skip in CI by design.
      - name: Playwright (replay, live-deterministic, interactive, inspectors, break-it, import/export)
        run: pnpm exec playwright test
      # The composer's ledger-v2 decision controls only render in AGENT mode
      # against a real project on disk, so neither the exhibit suite above
      # nor the deployed-composer smoke can reach them (dspack-studio#32).
      # This drives the real static export + the real agent + real files.
      - name: Composer static export (the agent-mode suite's artifact)
        run: pnpm --filter composer build
      # The hosted/demo experience: the same static export served with NO agent,
      # exactly what a visitor gets. Exercises the in-browser governed BUILD
      # (propose → S1/S2/S3 → repair → emit → render → refine), validation,
      # preview, export, and client-bundle hygiene — the deployed acceptance
      # criteria, verified BEFORE deploy.
      - name: Playwright (composer hosted/demo smoke — in-browser Build, repair, refine, hygiene)
        run: pnpm exec playwright test --config playwright.composer-smoke.config.ts
      - name: Playwright (composer agent-mode decisions + accessibility)
        run: pnpm exec playwright test --config playwright.composer-agent.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
